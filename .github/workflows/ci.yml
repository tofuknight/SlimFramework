name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Release build
        run: dotnet build SlimFramework.sln -c Release
      - name: Headless demo
        run: dotnet run --project samples/SlimFramework.Demo.Runner
