name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Release build
        run: dotnet build SlimFramework.sln -c Release
      - name: Headless demo
        run: dotnet run --project samples/SlimFramework.Demo.Runner
      - name: Asset catalog tool
        run: |
          dotnet run --project tools/Slim.AssetCatalogTool -c Release -- generate samples/DemoGame/Assets/resource_refs.json \
            --catalog /tmp/resource_refs.bytes \
            --code /tmp/AssetKeys.cs \
            --namespace SlimFramework.DemoGame \
            --class AssetKeys \
            --project samples/DemoGame
          cmp /tmp/resource_refs.bytes samples/DemoGame/Assets/resource_refs.bytes
          cmp /tmp/AssetKeys.cs samples/DemoGame/AssetKeys.cs
      - name: Install p7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Luban generate.sh checksum and usage
        run: |
          if tools/Luban/generate.sh; then
            echo "tools/Luban/generate.sh exited 0, expected 2"
            exit 1
          else
            code=$?
            if [ "$code" -ne 2 ]; then
              echo "tools/Luban/generate.sh exited $code, expected 2"
              exit 1
            fi
          fi
