syntax = "proto3";

package slim.resource.v1;

option csharp_namespace = "SlimFramework.Contracts.Resource.V1";

// 一条资源引用。线格式只有这四个字段。
// ref_key：运行时和存档用的稳定身份，由游戏分配。
// constant：DisplayKey。给代码和清单用的名字，可以是空字符串（这条没有名字）。
// uid / path：加载地址，至少要有一个非空白。运行时非空 uid 优先，否则 path。
message ResourceRef {
  int32 ref_key = 1;
  string constant = 2;
  string uid = 3;
  string path = 4;
}

// map 的 key 必须与 ResourceRef.ref_key 一致。
message ResourceRefCatalog {
  map<int32, ResourceRef> refs = 1;
}
